  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyKnow" />
  <title>MyKnow 资料库</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="./icon-192.png" />
  <style>
    :root {
      --ink: #0b1220;
      --raised: #121c2c;
      --high: #1a2740;
      --sand: #e8a838;
      --foam: #4ecdc4;
      --cloud: #e8eef4;
      --mist: #9aa4b2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--cloud); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
    body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    a { color: var(--foam); }
    header.app {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--ink);
      position: sticky; top: 0; z-index: 5;
    }
    header.app h1 { margin: 0; font-size: 22px; }
    header.app p { margin: 4px 0 0; color: var(--mist); font-size: 13px; }
    .install {
      display: none; margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px;
      background: #3d2e12; color: #ffe2a8; align-items: center; justify-content: space-between; gap: 12px;
    }
    .install.show { display: flex; }
    .install button, .nav button, .chip {
      border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    .install button { background: var(--sand); color: #1a1204; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px; }
    .chip { background: var(--high); color: var(--cloud); white-space: nowrap; }
    .chip.on { background: var(--sand); color: #1a1204; }
    .list { padding: 8px 16px 24px; display: grid; gap: 10px; }
    .card {
      background: var(--raised); border-radius: 16px; padding: 16px; text-align: left;
      color: inherit; text-decoration: none; display: block; border: 0; width: 100%; cursor: pointer;
    }
    .kicker { color: var(--sand); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .card h2 { margin: 6px 0 4px; font-size: 17px; }
    .card p, .note { margin: 0; color: var(--mist); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .search { width: 100%; margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid #3a4a63; background: var(--raised); color: var(--cloud); font-size: 16px; }
    table { width: 100%; border-collapse: collapse; background: var(--raised); border-radius: 16px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 14px; border-bottom: 1px solid #3a4a63; vertical-align: top; }
    th { color: var(--mist); width: 38%; font-weight: 500; }
    td { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .back { background: none; color: var(--foam); border: 0; padding: 0 0 8px; font-size: 15px; cursor: pointer; }
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      background: var(--raised); padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .nav button { background: transparent; color: var(--mist); }
    .nav button.on { color: var(--sand); }
    .page { display: none; }
    .page.on { display: block; }
  </style>
</head>
<body>
  <div id="installBar" class="install">
    <span>安装到手机桌面，不用下载 APK</span>
    <button id="installBtn" type="button">安装</button>
  </div>

  <section id="page-list" class="page on">
    <header class="app">
      <h1>MyKnow</h1>
      <p>好盈 / 思翼 / 云卓 / GNSS / CUAV 资料</p>
    </header>
    <div class="chips" id="chips"></div>
    <div class="list" id="deviceList"></div>
  </section>

  <section id="page-docs" class="page">
    <header class="app"><h1>文档</h1><p>接线、保护、拉力对照</p></header>
    <div class="list" id="docList"></div>
  </section>

  <section id="page-search" class="page">
    <header class="app"><h1>搜索</h1></header>
    <div class="list">
      <input class="search" id="q" placeholder="搜 H13、H150、X7、TF02、TF03、A8…" />
      <div id="searchHits"></div>
    </div>
  </section>

  <section id="page-detail" class="page">
    <header class="app">
      <button class="back" type="button" id="backBtn">← 返回</button>
      <h1 id="detailTitle">资料</h1>
    </header>
    <div class="list" id="detailBody"></div>
  </section>

  <nav class="nav">
    <button type="button" data-tab="list" class="on">器件</button>
    <button type="button" data-tab="docs">文档</button>
    <button type="button" data-tab="search">搜索</button>

const $ = (id) => document.getElementById(id);
let filter = "";

function showPage(name) {
  document.querySelectorAll(".page").forEach((el) => el.classList.toggle("on", el.id === "page-" + name));
  document.querySelectorAll(".nav button").forEach((btn) => btn.classList.toggle("on", btn.dataset.tab === name));
  window.scrollTo(0, 0);
}

function renderChips() {
  const keys = ["", "PROPULSION", "ESC", "MOTOR", "PROPELLER", "FLIGHT_CONTROLLER", "CAMERA", "GPS", "OTHER"];
  $("chips").innerHTML = keys.map((key) =>
    `<button class="chip ${filter === key ? "on" : ""}" data-type="${key}">${key ? TYPES[key] : "全部"}</button>`
  ).join("");
}

function renderDevices() {
  const rows = devices.filter((d) => !filter || d.type === filter);
  $("deviceList").innerHTML = rows.map((d) => `
    <button class="card" data-open="device:${d.id}">
      <div class="kicker">${TYPES[d.type]}</div>
      <h2>${d.model}</h2>
      <p>${d.notes.split("\n")[0]}</p>
    </button>`).join("");
}

function renderDocs() {
  $("docList").innerHTML = articles.map((a) => `
    <button class="card" data-open="doc:${a.id}">
      <div class="kicker">${CATS[a.cat]}</div>
      <h2>${a.title}</h2>
    </button>`).join("");
}

function specTable(specs) {
  return `<table>${specs.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table>`;
}

function openDevice(id) {
  const d = devices.find((x) => x.id === id);
  if (!d) return;
  $("detailTitle").textContent = d.model;
  $("detailBody").innerHTML = `
    <div class="kicker">${d.brand} · ${TYPES[d.type]}</div>
    ${specTable(d.specs)}
    <p class="note">${d.notes}</p>
    <p><a href="${d.url}" target="_blank" rel="noopener">打开官方资料</a>${d.spec ? ` · <a href="${d.spec}" target="_blank" rel="noopener">技术参数</a>` : ""}${d.manual ? ` · <a href="${d.manual}" target="_blank" rel="noopener">说明书</a>` : ""}</p>`;
  showPage("detail");
}

function openDoc(id) {
  const a = articles.find((x) => x.id === id);
  if (!a) return;
  $("detailTitle").textContent = a.title;
  $("detailBody").innerHTML = `<div class="kicker">${CATS[a.cat]}</div><p class="note">${a.body}</p>`;
  showPage("detail");
}

function search(text) {
  const q = text.trim().toLowerCase();
  const hits = [];
  if (!q) { $("searchHits").innerHTML = ""; return; }
  devices.forEach((d) => {
    const blob = [d.model, d.notes, ...d.specs.flat()].join(" ").toLowerCase();
    if (blob.includes(q)) hits.push(`<button class="card" data-open="device:${d.id}"><div class="kicker">${TYPES[d.type]}</div><h2>${d.model}</h2></button>`);
  });
  articles.forEach((a) => {
    if ((a.title + a.body).toLowerCase().includes(q)) hits.push(`<button class="card" data-open="doc:${a.id}"><div class="kicker">文档</div><h2>${a.title}</h2></button>`);
  });
  $("searchHits").innerHTML = hits.join("") || `<p class="note">没有匹配</p>`;
}

document.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-type]");
  if (chip) { filter = chip.dataset.type; renderChips(); renderDevices(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { showPage(tab.dataset.tab); return; }
  const open = e.target.closest("[data-open]");
  if (open) {
    const [kind, id] = open.dataset.open.split(":");
    if (kind === "device") openDevice(id);
    else openDoc(id);
  }
});
$("backBtn").onclick = () => showPage("list");
$("q").addEventListener("input", (e) => search(e.target.value));

renderChips();
renderDevices();
renderDocs();

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $("installBar").classList.add("show");
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("installBar").classList.remove("show");
};
if (window.matchMedia("(display-mode: standalone)").matches) {
  $("installBar").classList.remove("show");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
