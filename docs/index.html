<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyKnow" />
  <title>MyKnow 资料库</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="./icon-192.png" />
  <style>
    :root {
      --ink: #0b1220;
      --raised: #121c2c;
      --high: #1a2740;
      --sand: #e8a838;
      --foam: #4ecdc4;
      --cloud: #e8eef4;
      --mist: #9aa4b2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--cloud); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
    body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    a { color: var(--foam); }
    header.app {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--ink);
      position: sticky; top: 0; z-index: 5;
    }
    header.app h1 { margin: 0; font-size: 22px; }
    header.app p { margin: 4px 0 0; color: var(--mist); font-size: 13px; }
    .install {
      display: none; margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px;
      background: #3d2e12; color: #ffe2a8; align-items: center; justify-content: space-between; gap: 12px;
    }
    .install.show { display: flex; }
    .install button, .nav button, .chip {
      border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    .install button { background: var(--sand); color: #1a1204; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px; }
    .chip { background: var(--high); color: var(--cloud); white-space: nowrap; }
    .chip.on { background: var(--sand); color: #1a1204; }
    .list { padding: 8px 16px 24px; display: grid; gap: 10px; }
    .card {
      background: var(--raised); border-radius: 16px; padding: 16px; text-align: left;
      color: inherit; text-decoration: none; display: block; border: 0; width: 100%; cursor: pointer;
    }
    .kicker { color: var(--sand); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .card h2 { margin: 6px 0 4px; font-size: 17px; }
    .card p, .note { margin: 0; color: var(--mist); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .search { width: 100%; margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid #3a4a63; background: var(--raised); color: var(--cloud); font-size: 16px; }
    table { width: 100%; border-collapse: collapse; background: var(--raised); border-radius: 16px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 14px; border-bottom: 1px solid #3a4a63; vertical-align: top; }
    th { color: var(--mist); width: 38%; font-weight: 500; }
    td { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .back { background: none; color: var(--foam); border: 0; padding: 0 0 8px; font-size: 15px; cursor: pointer; }
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
      background: var(--raised); padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .nav button { background: transparent; color: var(--mist); }
    .nav button.on { color: var(--sand); }
    .page { display: none; }
    .page.on { display: block; }
  </style>
</head>
<body>
  <div id="installBar" class="install">
    <span>安装到手机桌面，不用下载 APK</span>
    <button id="installBtn" type="button">安装</button>
  </div>

  <section id="page-list" class="page on">
    <header class="app">
      <h1>MyKnow</h1>
      <p>电机电调与吊舱资料</p>
    </header>
    <div class="chips" id="chips"></div>
    <div class="list" id="deviceList"></div>
  </section>

  <section id="page-video" class="page">
    <header class="app"><h1>视频源</h1><p>ZR10 出图地址，App 里点开即可拉流</p></header>
    <div class="list" id="videoList"></div>
  </section>

  <section id="page-docs" class="page">
    <header class="app"><h1>文档</h1><p>接线、保护、拉力对照</p></header>
    <div class="list" id="docList"></div>
  </section>

  <section id="page-search" class="page">
    <header class="app"><h1>搜索</h1></header>
    <div class="list">
      <input class="search" id="q" placeholder="搜 H15、电调、CAN、拉力…" />
      <div id="searchHits"></div>
    </div>
  </section>

  <section id="page-detail" class="page">
    <header class="app">
      <button class="back" type="button" id="backBtn">← 返回</button>
      <h1 id="detailTitle">资料</h1>
    </header>
    <div class="list" id="detailBody"></div>
  </section>

  <nav class="nav">
    <button type="button" data-tab="list" class="on">器件</button>
    <button type="button" data-tab="video">视频</button>
    <button type="button" data-tab="docs">文档</button>
    <button type="button" data-tab="search">搜索</button>
  </nav>

<script>

const SPEC = "https://www.hobbywing.com/uploads/file/20260228/a87197efd698c80fd69797af9c3ce88d.pdf";

const CATS = { WIRING: "接线与安装", SAFETY: "安全与维护", MATCHING: "选型匹配" };

const devices = [
  {

    notes: "现名 H15MD Plus，原品名 H15 Plus。行业共轴一体动力。料号 HW-SMC819DUL00。\n单轴推荐起飞重量 80 kg，最大拉力 195 kg（海平面，只作机动/抗风冗余）。适配 24S~28S LiPo，额定 24S-92V / 28S-108V，输入 36~130 V。IPX6，-40~60℃。碳管 Ø80 mm / 壁厚 5 mm。重量 14550±200 g（含线不含桨）。",
    url: PRODUCT,
    extraLinks: [["技术参数 PDF", SPEC], ["说明书 PDF", MANUAL]],
    specs: [
      ["产品型号", "H15MD Plus-24S"], ["原品名", "H15 Plus"], ["料号", "HW-SMC819DUL00"],
      ["最大拉力", "195 kg"], ["单轴推荐拉力", "80 kg"], ["推荐力效", "7.5 g/W"],
      ["适配电池", "24S~28S LiPo"], ["额定电压", "24S-92V / 28S-108V"], ["电压范围", "36~130 V"],
      ["额定输入功率", "10600 W"], ["额定输出功率", "9300 W"],

      ["重量(含线不含桨)", "14550±200 g"], ["电源线", "7AWG 2500±50 mm"],
      ["信号线", "2700±50 mm"], ["油门", "PWM + CAN"], ["调参盒", "DataLinkBox G3"],

    url: SPEC,
    specs: [
      ["持续电流", "110 A"], ["瞬时电流", "300 A / 3s"], ["电压范围", "36~130 V"],

  },

    id: "msc", type: "PROPELLER", brand: "好盈 Hobbywing", model: "MSC 73x21 直桨",
    notes: "原厂直桨，碳纤维，1300±20 g。D60-6×M6，中心孔 D20。M6×16 / 8 N·m。必须原厂配套桨。",
    url: PRODUCT,
    specs: [["型号", "MSC 73x21"], ["类型", "直桨"], ["重量", "1300±20 g"], ["安装", "D60-6×M6，中心孔 D20"], ["螺丝", "M6×16 / 8 N·m"]]
  },

    notes: "原厂折叠桨，1854.8±32 g。D46-4×M6，中心孔 D16。M6×14 / 8 N·m。支持定桨。",
    url: PRODUCT,
    specs: [["型号", "MFC 73x23"], ["类型", "折叠桨"], ["重量", "1854.8±32 g"], ["安装", "D46-4×M6，中心孔 D16"], ["螺丝", "M6×14 / 8 N·m"]]
  },
  {
    id: "zr10", type: "CAMERA", brand: "思翼 SIYI", model: "ZR10 2K 变焦光电吊舱",
    notes: "三轴增稳变焦吊舱。10 倍光学 / 30 倍混合变焦，2K 录像，星光夜视 + HDR。1/2.7 英寸 4 MP CMOS。供电 11~25.2 V（3~6S），381 g。默认 IP 192.168.144.25。",
    url: ZR10_PAGE,
    extraLinks: [["说明书 PDF", ZR10_MANUAL]],
    specs: [
      ["产品型号", "ZR10"], ["传感器", "1/2.7 英寸 CMOS 4 MP"],
      ["光学变焦", "10 倍"], ["混合变焦", "30 倍"], ["焦距", "5.2~47.4 mm"],
      ["光圈", "F1.8~2.5"], ["录像", "2K 2560×1440 @30fps"],
      ["夜视", "星光 + HDR"], ["偏航", "约 320°"],
      ["俯仰可控", "−90° ~ +25°"], ["横滚", "−30° ~ +30°"],
      ["增稳", "±0.01°"], ["视频", "以太网 RTSP"],
      ["控制", "S.Bus / UART / UDP / TCP"],
      ["默认IP", "192.168.144.25"],
      ["RTSP", "rtsp://192.168.144.25:8554/main.264"],
      ["电压", "11~25.2 V（3~6S）"], ["功耗", "平均 4 W / 峰值 12 W"],
      ["防护", "IP4X"], ["温度", "−10~50 ℃"],
      ["尺寸", "121×101×78 mm"], ["重量", "381 g"],
      ["飞控", "ArduPilot / PX4 MAVLink"]
    ]
  }
];

const videoSources = [
  {
    id: "zr10-main",
    name: "SIYI ZR10 主码流",
    url: "rtsp://192.168.144.25:8554/main.264",
    note: "默认视频源。手机和吊舱同一网段 192.168.144.x。浏览器不能直接播 RTSP，请用 App「视频」页拉流。",
  },
  {
    id: "zr10-cam2",
    name: "SIYI ZR10 相机2",
    url: "rtsp://192.168.144.26:8554/main.264",
    note: "双吊舱第二路，对应 SIYI FPV 的 Camera 2。",
  },
];

const articles = [
  { id: "wiring", cat: "WIRING", title: "H15 Plus 接线与线序", body:
`电源：7AWG，红正黑负，2500±50 mm。

PWM（黑白）
• 黑 GND　白 油门 Signal
• 脉宽 1100~1940 μs，50~500 Hz，5V/3.3V

CAN（黄灰绿）
• 黄 CAN GND　灰 CH　绿 CL
• 出厂 HWCAN，可选 DroneCAN；无终端电阻；500 kbps
• 出厂 ID=1 通道=1，同机不能重复
• 数字油门建议怠速 6%` },
  { id: "install", cat: "WIRING", title: "H15 Plus 安装与碳管", body:
`组成：电机×2、电调×2、桨×2、电机座、螺钉、LED。
碳管 Ø80 mm，壁厚 5 mm（可 3 mm），电机座 3° 倾角。
直桨 MSC 73x21；折叠桨 MFC 73x23。调试先卸桨。禁止换非配套桨。` },
  { id: "protect", cat: "SAFETY", title: "H15 Plus 保护与告警", body:
`无低压保护、无过温停转。
上电 36~130 V 才能自检。堵转重启 3 次后关输出。
过流约 800 A / 4 μs。油门丢失 >1 s 关输出。
首次启动约 3 s 延时，飞控要加斜坡，否则弹射起飞。
MOS>110℃ 或电容>100℃ 只告警不停转。` },
  { id: "thrust", cat: "MATCHING", title: "H15 Plus 24S 拉力对照", body:
`92V / MSC 73x21 / 海平面 / 仅供参考

33%  22.2 kg   19.3 A    12.5 g/W
50%  55.4 kg   68.2 A     8.8 g/W
58%  76.7 kg  109.5 A     7.6 g/W
60%  82.6 kg  122.1 A     7.4 g/W
100% 195.0 kg  465.8 A     4.5 g/W

推荐 80 kg ≈ 58%~60% 油门。195 kg 不是额定载荷。` },
  { id: "caution", cat: "SAFETY", title: "H15 Plus 使用注意", body:
`工业非载人。-40~60℃。必须原厂桨。禁止超载。禁止私拆。落地后先别摸，很烫。地面测试不要带桨。` },
  { id: "zr10-io", cat: "WIRING", title: "SIYI ZR10 接线、IP 与控制", body:
`供电 11~25.2 V（3S~6S）。2023 年 6 月前批次多为 11~16.5 V，上 6S 先确认。
平均约 4 W，峰值约 12 W。电源和网线要软，别扯云台。

视频
• 默认 IP：192.168.144.25
• RTSP：rtsp://192.168.144.25:8554/main.264
• 无图先 ping 192.168.144.25。以太网 RX+/RX− 不要交叉

控制：S.Bus、UART（SDK / MAVLink）、以太网 UDP/TCP。
兼容 ArduPilot / PX4。倒装、机头安装可用。禁止拆云台、禁止加额外负载。` }
];

const $ = (id) => document.getElementById(id);
let filter = "";

function showPage(name) {
  document.querySelectorAll(".page").forEach((el) => el.classList.toggle("on", el.id === "page-" + name));
  document.querySelectorAll(".nav button").forEach((btn) => btn.classList.toggle("on", btn.dataset.tab === name));
  window.scrollTo(0, 0);
}

function renderChips() {
  const keys = ["", "PROPULSION", "ESC", "MOTOR", "PROPELLER", "CAMERA"];
  $("chips").innerHTML = keys.map((key) =>
    `<button class="chip ${filter === key ? "on" : ""}" data-type="${key}">${key ? TYPES[key] : "全部"}</button>`
  ).join("");
}

function renderDevices() {
  const rows = devices.filter((d) => !filter || d.type === filter);
  $("deviceList").innerHTML = rows.map((d) => `
    <button class="card" data-open="device:${d.id}">
      <div class="kicker">${TYPES[d.type]}</div>
      <h2>${d.model}</h2>
      <p>${d.notes.split("\n")[0]}</p>
    </button>`).join("");
}

function renderVideos() {
  $("videoList").innerHTML = videoSources.map((s) => `
    <div class="card">
      <div class="kicker">视频源</div>
      <h2>${s.name}</h2>
      <p>${s.url}</p>
      <p>${s.note}</p>
    </div>`).join("");
}

function renderDocs() {
  $("docList").innerHTML = articles.map((a) => `
    <button class="card" data-open="doc:${a.id}">
      <div class="kicker">${CATS[a.cat]}</div>
      <h2>${a.title}</h2>
    </button>`).join("");
}

function specTable(specs) {
  return `<table>${specs.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table>`;
}

function openDevice(id) {
  const d = devices.find((x) => x.id === id);
  if (!d) return;
  $("detailTitle").textContent = d.model;
  $("detailBody").innerHTML = `
    <div class="kicker">${d.brand} · ${TYPES[d.type]}</div>
    ${specTable(d.specs)}
    <p class="note">${d.notes}</p>
    <p><a href="${d.url}" target="_blank" rel="noopener">打开官方资料</a>${
      (d.extraLinks || []).map(([name, href]) => ` · <a href="${href}" target="_blank" rel="noopener">${name}</a>`).join("")
    }</p>`;
  showPage("detail");
}

function openDoc(id) {
  const a = articles.find((x) => x.id === id);
  if (!a) return;
  $("detailTitle").textContent = a.title;
  $("detailBody").innerHTML = `<div class="kicker">${CATS[a.cat]}</div><p class="note">${a.body}</p>`;
  showPage("detail");
}

function search(text) {
  const q = text.trim().toLowerCase();
  const hits = [];
  if (!q) { $("searchHits").innerHTML = ""; return; }
  devices.forEach((d) => {
    const blob = [d.model, d.notes, ...d.specs.flat()].join(" ").toLowerCase();
    if (blob.includes(q)) hits.push(`<button class="card" data-open="device:${d.id}"><div class="kicker">${TYPES[d.type]}</div><h2>${d.model}</h2></button>`);
  });
  articles.forEach((a) => {
    if ((a.title + a.body).toLowerCase().includes(q)) hits.push(`<button class="card" data-open="doc:${a.id}"><div class="kicker">文档</div><h2>${a.title}</h2></button>`);
  });
  $("searchHits").innerHTML = hits.join("") || `<p class="note">没有匹配</p>`;
}

document.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-type]");
  if (chip) { filter = chip.dataset.type; renderChips(); renderDevices(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { showPage(tab.dataset.tab); return; }
  const open = e.target.closest("[data-open]");
  if (open) {
    const [kind, id] = open.dataset.open.split(":");
    if (kind === "device") openDevice(id);
    else openDoc(id);
  }
});
$("backBtn").onclick = () => showPage("list");
$("q").addEventListener("input", (e) => search(e.target.value));

renderChips();
renderDevices();
renderVideos();
renderDocs();

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $("installBar").classList.add("show");
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("installBar").classList.remove("show");
};
if (window.matchMedia("(display-mode: standalone)").matches) {
  $("installBar").classList.remove("show");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>
